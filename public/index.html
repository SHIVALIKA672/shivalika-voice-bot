<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Voice Interview</title>
  <meta name="description" content="Ask me interview questions out loud and hear how I'd answer.">
  <meta name="theme-color" content="#07090d">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%2307090d'/%3E%3Ccircle cx='12' cy='12' r='7' fill='none' stroke='%235ef0ff' stroke-width='1.6' stroke-dasharray='2 1.6'/%3E%3Ccircle cx='12' cy='12' r='3.2' fill='%235ef0ff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-phase="idle">
  <div class="shell">
    <aside class="profile">
      <div class="ident">
        <p class="kicker"><span class="live" aria-hidden="true"></span>Online · voice interview</p>
        <h1 class="name" id="name">Loading</h1>
        <p class="role" id="headline"></p>
      </div>

      <dl class="facts" id="facts"></dl>

      <nav class="prompts-block" aria-label="Suggested questions">
        <h2 class="label">// Try asking</h2>
        <ol class="prompts" id="chips"></ol>
      </nav>

      <p class="credit" id="credit"></p>
    </aside>

    <main class="console">
      <div class="toolbar">
        <span class="hint" aria-hidden="true">Space to talk</span>
        <label class="tool toggle">
          <input type="checkbox" id="handsFree">
          <span>Hands-free <b id="handsFreeState">off</b></span>
        </label>
        <button class="tool" id="settingsBtn" type="button" aria-label="Voice settings">Voice</button>
      </div>

      <div class="stage">
        <button class="orb" id="mic" type="button" aria-label="Start talking">
          <canvas id="viz" aria-hidden="true"></canvas>
          <span class="orb-icon" aria-hidden="true">
            <svg class="i-mic" viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11h-2Z"/></svg>
            <svg class="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
          </span>
        </button>
        <p class="status" id="status" role="status">Tap the orb and ask me anything</p>
      </div>

      <div class="banner" id="banner" role="note" hidden></div>

      <section class="log" id="log" aria-live="polite" aria-label="Conversation"></section>

      <form class="ask" id="form" autocomplete="off">
        <span class="caret" aria-hidden="true">&gt;</span>
        <label class="sr-only" for="input">Type a question</label>
        <input id="input" type="text" maxlength="600" placeholder="or type a question" enterkeyhint="send">
        <button type="submit">Ask&nbsp;↵</button>
      </form>
    </main>
  </div>

  <dialog id="settings" aria-labelledby="settingsTitle">
    <form method="dialog" class="sheet">
      <h2 id="settingsTitle">// Voice</h2>
      <label for="voiceSelect">Voice</label>
      <select id="voiceSelect"></select>
      <p class="fine" id="voiceNote"></p>
      <label for="rate">Speed <output id="rateOut">1.0×</output></label>
      <input id="rate" type="range" min="0.8" max="1.25" step="0.05" value="1">
      <label class="check"><input id="mute" type="checkbox"> Text only, no sound</label>
      <div class="sheet-actions">
        <button type="button" id="testVoice" class="ghost">Test voice</button>
        <button value="close" class="primary">Done</button>
      </div>
      <p class="fine">Talking to the bot works in Chrome, Edge, Safari and Firefox. Allow microphone access when your browser asks.</p>
    </form>
  </dialog>

  <script src="/app.js" type="module"></script>
</body>
</html>
